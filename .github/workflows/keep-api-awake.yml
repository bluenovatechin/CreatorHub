# Keeps the free Render API from falling asleep, so visitors don't wait ~1 minute (or see
# "Can't reach the Bluenova server"). GitHub runs this for free every 10 minutes; it just opens /healthz.
# To stop it: GitHub → Actions → "Keep API awake" → ••• → Disable workflow (or delete this file).
# Note: GitHub may delay scheduled runs by a few minutes, and pauses them after 60 days without commits.
name: Keep API awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {} # also allows a manual "Run workflow" button

permissions: {} # this job needs no access to the repository

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the API health check
        run: curl --silent --show-error --max-time 120 --retry 3 --retry-delay 10 https://bluenova-api.onrender.com/healthz
